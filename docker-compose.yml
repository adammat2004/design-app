services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: garden
      POSTGRES_PASSWORD: garden
      POSTGRES_DB: garden_studio
    ports:
      - '5432:5432'
    volumes:
      - garden_studio_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U garden -d garden_studio']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  garden_studio_db:
